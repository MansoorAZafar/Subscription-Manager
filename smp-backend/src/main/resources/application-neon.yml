spring:
  datasource:
    url: ${NEON_JDBC_URL}
    username: ${NEON_DB_USERNAME}
    password: ${NEON_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${NEON_POOL_MAX_SIZE:8}
      minimum-idle: 0
      connection-timeout: 30000
      validation-timeout: 5000
      keepalive-time: 0
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    url: ${NEON_MIGRATION_JDBC_URL}
    user: ${NEON_DB_USERNAME}
    password: ${NEON_DB_PASSWORD}
