name: Backend CI and Docker Hub

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "smp-backend/**"
      - ".github/workflows/backend-image.yml"
  push:
    branches: ["**"]
    tags: ["bv*"]

permissions:
  contents: read

concurrency:
  group: backend-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Backend Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend tests and package
        working-directory: smp-backend
        run: mvn --batch-mode --no-transfer-progress verify

  publish-image:
    name: Publish Docker Hub image
    needs: checks
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/bv')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push versioned and latest images
        uses: docker/build-push-action@v6
        with:
          context: ./smp-backend
          file: ./smp-backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/subscription-management-backend:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/subscription-management-backend:latest

      - name: Trigger deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK"
          else
            echo "RENDER_DEPLOY_HOOK is not configured; skipping deploy trigger."
          fi
